server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://${PAYROLL_DB_HOST:payroll-db}:3306/payroll_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${PAYROLL_DB_USERNAME:payroll}
    password: ${PAYROLL_DB_PASSWORD:payroll123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: "payroll-event:com.crm.payroll.messaging.PayrollEvent,employee-event:com.crm.payroll.messaging.EmployeeEvent"

app:
  kafka:
    topic:
      employee-events: employee-events
      payroll-events: payroll-events

springdoc:
  swagger-ui:
    path: /swagger-ui.html