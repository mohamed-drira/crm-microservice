server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://${CRM_DB_HOST:crm-db}:3306/crm_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${CRM_DB_USERNAME:crm}
    password: ${CRM_DB_PASSWORD:crm123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: crm-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.crm.hr.messaging,com.crm.billing.messaging,com.crm.crmservice.messaging"
        spring.json.type.mapping: "employee-event:com.crm.crmservice.messaging.EmployeeEvent,invoice-event:com.crm.crmservice.messaging.InvoiceEvent"

app:
  kafka:
    topic:
      employee-events: employee-events
      invoice-events: invoice-events

springdoc:
  swagger-ui:
    path: /swagger-ui.html