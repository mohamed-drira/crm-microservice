server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://${HR_DB_HOST:hr-db}:3306/hr_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${HR_DB_USERNAME:hr}
    password: ${HR_DB_PASSWORD:hr123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: "employee-event:com.crm.hr.messaging.EmployeeEvent"

app:
  kafka:
    topic:
      employee-events: employee-events

springdoc:
  swagger-ui:
    path: /swagger-ui.html
