server:
  port: 8086

spring:
  datasource:
    url: jdbc:mysql://${NOTIFICATION_DB_HOST:notification-db}:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${NOTIFICATION_DB_USERNAME:notification}
    password: ${NOTIFICATION_DB_PASSWORD:notification123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.crm.hr.messaging,com.crm.payroll.messaging,com.crm.billing.messaging"
        spring.json.type.mapping: "employee-event:com.crm.notification.messaging.EmployeeEvent,payroll-event:com.crm.notification.messaging.PayrollEvent,invoice-event:com.crm.notification.messaging.InvoiceEvent"

app:
  kafka:
    topic:
      employee-events: employee-events
      payroll-events: payroll-events
      invoice-events: invoice-events
  notification:
    admin-usernames: admin

springdoc:
  swagger-ui:
    path: /swagger-ui.html
