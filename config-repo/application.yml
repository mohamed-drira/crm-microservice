# Shared configuration served to every service by config-server.
# Individual service files (hr-service.yml, api-gateway.yml, ...) override these keys.

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: info,health,metrics

spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    org.hibernate.SQL: INFO
    com.crm: DEBUG
