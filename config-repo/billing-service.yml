server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://${BILLING_DB_HOST:billing-db}:3306/billing_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${BILLING_DB_USERNAME:billing}
    password: ${BILLING_DB_PASSWORD:billing123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: "invoice-event:com.crm.billing.messaging.InvoiceEvent"

app:
  kafka:
    topic:
      invoice-events: invoice-events

springdoc:
  swagger-ui:
    path: /swagger-ui.html