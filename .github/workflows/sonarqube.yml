name: SonarQube analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, test, and generate coverage
        run: mvn -B verify -DskipITs

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v4.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=mohamed-drira_crm-microservice
            -Dsonar.organization=mohamed-drira
            -Dsonar.sources=api-gateway/src,billing-service/src,config-server/src,crm-service/src,discovery-server/src,hr-service/src,notification-service/src,payroll-service/src
            -Dsonar.excludes=**/test/**,**/node_modules/**,**/target/**,**/config-repo/**,**/keycloak/**,**/docs/**
            -Dsonar.tests=hr-service/src/test,payroll-service/src/test
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

      - name: SonarCloud Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
